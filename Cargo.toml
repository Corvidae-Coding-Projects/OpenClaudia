[package]
name = "openclaudia"
version = "0.5.0"
edition = "2021"
rust-version = "1.98"
description = "Open-source universal agent harness - Claude Code capabilities for any AI"
license = "MIT"
repository = "https://github.com/dollspace-gay/openclaudia"
keywords = ["ai", "agent", "claude", "llm", "proxy"]
categories = ["command-line-utilities", "development-tools"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (axum 0.8)
axum = { version = "0.8", features = ["json", "ws"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring"] }

# HTTP client for upstream requests
# Keep the direct transport generation aligned with Crosslink while its current
# published release remains on reqwest 0.12. This removes a second HTTP stack.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# MCP tool arguments are validated against the exact discovered schema before
# dispatch. Disable network/file schema retrieval: untrusted remote references
# fail closed instead of turning validation into ambient I/O.
jsonschema = { version = "0.50.1", default-features = false }

# Configuration
# Disable the `ini` feature (default-on in config 0.15) — we only consume
# YAML + JSON via this dep (no `.ini` files in the project). Dropping
# `ini` removes the rust-ini → ordered-multimap → hashbrown 0.14.5
# transitive chain that pulls in RUSTSEC-2024-0402 (Borsh non-canonical
# HashMap serialization).
config = { version = "0.15", default-features = false, features = ["yaml", "json", "async"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
bytes = "1"
eventsource-stream = "0.2.3"
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID for session IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem
dirs = "6"
tempfile = "3"

# Absolute-path resolution for trusted binaries (e.g. the `git` plugin
# helper). Resolves once at first use via PATH lookup and caches the
# canonical PathBuf so subsequent Command::new invocations cannot be
# redirected by a later, attacker-controlled PATH mutation. Closes the
# PATH-injection escalation in `src/plugins/git.rs` (crosslink #679).
which = "8"

# Regex for hook matchers
regex = "1"

# POSIX shell word-splitting — used to convert a single model-supplied
# `args` string into argv tokens WITHOUT invoking a shell interpreter
# (closes shell-injection attacks on chainlink/static-analysis dispatch).
shlex = "2"

# OAuth and cryptography
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
url = "2"
ed25519-dalek = "3"
aes-gcm = "0.10"
urlencoding = "2"
zeroize = "1.9"

# CLI enhancements
rustyline = { version = "18", features = ["derive"] }
indicatif = "0.18"
crossterm = "0.29"
arboard = "3"
rpassword = "7.5"

# TUI framework
ratatui = "0.30"

# SQLite for stateful memory
rusqlite = { version = "0.38", features = ["backup", "bundled"] }

# Crosslink — local-first issue tracker + session memory + handoff
# notes. Deep integration replaces the legacy shell-out `chainlink`
# tool: we call the library's `db::*` API directly (no subprocess)
# and expose multiple OpenClaudia tools backed by the same store.
# Pinned to the latest published version on crates.io
# (https://crates.io/crates/crosslink). The native `sqlite3` link
# is shared via `rusqlite = "0.38"` above — both crates must agree
# (crosslink currently pins rusqlite ^0.38, which blocks rusqlite 0.40+)
# on the libsqlite3-sys major version or cargo refuses to link.
crosslink = "0.9.0-beta.1"

# Headless browser for web scraping (explicit opt-in, heavy dependency).
# The offline protocol bundle keeps builds reproducible. Runtime executable
# download is deliberately disabled; operators provide a compatible browser.
headless_chrome = { version = "1", optional = true, default-features = false, features = ["offline"] }
scraper = { version = "0.27", optional = true }

# HTML → Markdown conversion (turndown.js-inspired). Used by `web_fetch`
# to render fetched pages into LLM-friendly markdown without requiring a
# hosted conversion service.
htmd = "0.5"
# Maintained tree-sitter highlighting replaces syntect's unmaintained
# bincode/yaml-rust dump chain. The explicit language set covers the former
# built-in terminal profile; unknown fence tags retain the flat-color fallback.
arborium = { version = "2.18.1", default-features = false, features = [
    "lang-asm",
    "lang-bash",
    "lang-batch",
    "lang-c",
    "lang-c-sharp",
    "lang-clojure",
    "lang-cmake",
    "lang-cpp",
    "lang-css",
    "lang-d",
    "lang-diff",
    "lang-dockerfile",
    "lang-dot",
    "lang-elixir",
    "lang-erlang",
    "lang-fsharp",
    "lang-go",
    "lang-groovy",
    "lang-haskell",
    "lang-html",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-kotlin",
    "lang-lua",
    "lang-make",
    "lang-markdown",
    "lang-matlab",
    "lang-objc",
    "lang-ocaml",
    "lang-perl",
    "lang-php",
    "lang-powershell",
    "lang-python",
    "lang-r",
    "lang-regex",
    "lang-ruby",
    "lang-rust",
    "lang-scala",
    "lang-sql",
    "lang-swift",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-xml",
    "lang-yaml",
    "lang-zig",
] }
similar = { version = "3", features = ["inline"] }

[features]
default = []
browser = ["headless_chrome", "scraper"]
experimental-claude-subscription-auth = []

[dev-dependencies]
wiremock = "0.6"
# `#[tokio::test(start_paused = true)]` relies on Tokio's test clock. Keep
# that capability explicit and dev-only instead of obtaining it through an
# otherwise-unused helper crate.
tokio = { version = "1", features = ["test-util"] }
# Property-based testing for round-trip / invariant coverage across the
# provider adapters, parsers, and other algebraic surfaces.
# (Note: `rand_core` is no longer a direct dev-dep — its public traits
# `TryRng` / `OsRng-replacement SysRng` are re-exported via `rand` 0.10.)
proptest = "1"

[lints.clippy]
# Group denies at priority -1 so specific overrides (priority 0) can selectively allow.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Targeted exception (architectural review): `cargo deny` rejects duplicate
# drift and admits only the exact transitive generations recorded in each lock
# graph's policy. Clippy cannot express that reviewed exception model, so its
# coarser duplicate lint is disabled here rather than pretending the graph is
# singular.
multiple_crate_versions = "allow"

[lib]
name = "openclaudia"
path = "src/lib.rs"

[[bin]]
name = "openclaudia"
path = "src/main.rs"

# Keep local/test artifacts bounded while preserving useful line-level debug
# information. Release artifacts favor one optimized, reproducible link unit.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
debug = 0
lto = "thin"
strip = "symbols"
