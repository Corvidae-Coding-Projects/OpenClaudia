[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "auto_generate_cdp@0.4.6" },
]

[[licenses.clarify]]
crate = "auto_generate_cdp@0.4.6"
expression = "GPL-3.0-or-later"
license-files = [
    { path = "LICENSE.txt", hash = 0xc5a651aa },
]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "bincode@<2", reason = "The 1.x line is unmaintained; use a maintained format/version." },
    { crate = "yaml-rust", reason = "Unmaintained; use serde_yaml or a maintained parser." },
]
# Exact locked duplicate generations that current upstream dependency trees
# still require. One preferred generation per family remains unskipped, so any
# new second generation fails instead of disappearing into a global warning.
skip = [
    { crate = "base64@0.22.1" },
    { crate = "bitflags@1.3.2" },
    { crate = "block-buffer@0.10.4" },
    { crate = "cfg_aliases@0.1.1" },
    { crate = "convert_case@0.8.0" },
    { crate = "core-foundation@0.9.4" },
    { crate = "cpufeatures@0.2.17" },
    { crate = "crypto-common@0.1.7" },
    { crate = "darling@0.20.11" },
    { crate = "darling_core@0.20.11" },
    { crate = "darling_macro@0.20.11" },
    { crate = "digest@0.10.7" },
    { crate = "getrandom@0.2.17" },
    { crate = "getrandom@0.3.4" },
    { crate = "hashbrown@0.16.1" },
    { crate = "html5ever@0.38.0" },
    { crate = "markup5ever@0.38.0" },
    { crate = "mio@0.8.11" },
    { crate = "nix@0.28.0" },
    { crate = "rand@0.9.5" },
    { crate = "rand_core@0.6.4" },
    { crate = "rand_core@0.9.5" },
    { crate = "sha2@0.10.9" },
    { crate = "syn@2.0.119" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
    { crate = "windows-sys@0.48.0" },
    { crate = "windows-sys@0.60.2" },
    { crate = "windows-targets@0.48.5" },
    { crate = "windows_x86_64_gnu@0.48.5" },
    { crate = "windows_x86_64_msvc@0.48.5" },
    { crate = "winnow@0.7.15" },
    { crate = "winreg@0.10.1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
